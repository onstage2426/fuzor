name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: false
          body: "See [CHANGELOG.md](https://github.com/onstage2426/fuzor/blob/main/CHANGELOG.md) for release notes."
